<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./estilos/geral.css" rel="stylesheet" />
    <link href="./estilos/barra_superior.css" rel="stylesheet" />
    <link href="./estilos/principal.css" rel="stylesheet" />
    <link href="./estilos/carousel.css" rel="stylesheet" />
    <!-- <link href="/estilos/rodape.css" rel="stylesheet" />     -->
    <title href>Meu Planetinha</title>
  </head>
  <body>
    <header>
      <nav class="barra-de-navegacao">
        <!-- Left: Logo + Site Name -->
        <div class="logo-container">
          <a href="./" class="logo-link" aria-label="Meu Planetinha - Página Inicial">
            <div class="logo-icon">
              <i class="bi bi-planet"></i>
            </div>
            <h1 class="site-name">Meu Planetinha</h1>
          </a>
        </div>

        <!-- Center: Navigation Links -->
        <ul class="nav-links">
          <li><a href="./" aria-current="page">Início</a></li>
          <li><a href="./explorar/explorar.html">Explorar</a></li>
          <li><a href="./sobre_nos/sobre_nos.html">Sobre Nós</a></li>
        </ul>

        <!-- Right: Search Bar -->
        <form class="search-form" role="search">
          <div class="barra-de-pesquisa">
            <input 
              type="search" 
              placeholder="Pesquisar jogos..." 
              aria-label="Pesquisar jogos"
            />
            <button type="submit" aria-label="Buscar">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
      </nav>
    </header>

    <main>
      <!-- Space Carousel Navigation -->
      <section class="carousel-section">
        <div class="carousel-container">
          <div class="carousel-header">
            <h2 class="carousel-title">🌌 Escolha Seu Planeta</h2>
            <p class="carousel-subtitle">Cada planeta representa uma matéria diferente</p>
          </div>

          <div class="carousel-track">
            <!-- Planet: Matemática -->
            <div class="planet-card" data-subject="matematica">
              <div class="planet-visual" data-planet="matematica"></div>
              <p class="planet-label">Matemática</p>
            </div>

            <!-- Planet: Português -->
            <div class="planet-card" data-subject="portugues">
              <div class="planet-visual" data-planet="portugues"></div>
              <p class="planet-label">Português</p>
            </div>

            <!-- Planet: Geometria -->
            <div class="planet-card" data-subject="geometria">
              <div class="planet-visual" data-planet="geometria"></div>
              <p class="planet-label">Geometria</p>
            </div>

            <!-- Planet: Ciências -->
            <div class="planet-card" data-subject="ciencias">
              <div class="planet-visual" data-planet="ciencias"></div>
              <p class="planet-label">Ciências</p>
            </div>
          </div>

          <!-- Navigation Arrows -->
          <button class="carousel-nav left" aria-label="Planeta anterior">←</button>
          <button class="carousel-nav right" aria-label="Próximo planeta">→</button>

          <!-- Navigation Dots -->
          <div class="carousel-dots">
            <button class="carousel-dot active" data-index="0" aria-label="Ir para Matemática"></button>
            <button class="carousel-dot" data-index="1" aria-label="Ir para Português"></button>
            <button class="carousel-dot" data-index="2" aria-label="Ir para Geometria"></button>
            <button class="carousel-dot" data-index="3" aria-label="Ir para Ciências"></button>
          </div>
        </div>
      </section>

      <div class="secao-de-jogos">
        <div class="colecao-de-jogos">
          <p class="categoria-jgs">Populares</p>
          <div class="jgs">
            <a href="./jogos/Contando_Estrelas/index.html">
              <div class="jg">
                <div class="capa-jg">
                  <img src="./midia/Contando_Estrelas.png" alt="Descrição da imagem">
                </div>
                <p class="nome-jg">Contando Estrelas</p>
              </div>
            </a>
            
            <a href="./jogos/Jogo_de_Silaba/index.html">
              <div class="jg">
                <div class="capa-jg">
                  <img src="./midia/Jogo_de_silaba.png" alt="Descrição da imagem">
                </div>
                  
                <p class="nome-jg">Jogo de Sílaba</p>
              </div>
            </a>
          
          </div>
        </div>
      </div>

      <div class="secao-de-jogos">
        <div class="colecao-de-jogos">
          <p class="categoria-jgs">Matemática</p>
          <div class="jgs">
            <a href="./jogos/Contando_Estrelas/index.html">
              <div class="jg">
                <div class="capa-jg">
                  <img src="./midia/Contando_Estrelas.png" alt="Descrição da imagem">
                </div>
                <p class="nome-jg">Contando Estrelas</p>
              </div>
            </a>
          </div>
        </div>
      </div>

      <div class="secao-de-jogos">
        <div class="colecao-de-jogos">
          <p class="categoria-jgs">Português</p>
          <div class="jgs">
            <a href="./jogos/Jogo_de_Silaba/index.html">
              <div class="jg">
                <div class="capa-jg">
                  <img src="./midia/Jogo_de_silaba.png" alt="Descrição da imagem">
                </div>
                  
                <p class="nome-jg">Jogo de Sílaba</p>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Carousel JavaScript -->
    <script src="./scripts/carousel.js"></script>
  </body>
</html>
