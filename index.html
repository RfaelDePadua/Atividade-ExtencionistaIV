<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meu Planetinha: plataforma educacional gamificada para crianças. Explore planetas e aprenda brincando!">
  <title>Início — Meu Planetinha</title>

  <!-- Google Fonts: preconnect + stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS Load Order (do not reorder) -->
  <link rel="stylesheet" href="estilos/reset.css">
  <link rel="stylesheet" href="estilos/base.css">
  <link rel="stylesheet" href="estilos/animacoes.css">
  <link rel="stylesheet" href="estilos/layout.css">
  <link rel="stylesheet" href="estilos/pages/page-shell.css">
  <link rel="stylesheet" href="estilos/componentes.css">
  <link rel="stylesheet" href="components/components.css">
  <link rel="stylesheet" href="estilos/pages/homepage.css">
  <link rel="stylesheet" href="estilos/carousel-3d.css">
  <link rel="stylesheet" href="estilos/cards.css">
</head>
<body class="page-home">

  <!-- Skip-link omitted here — nav.html provides it -->

  <!-- Nav component (injected by components.js) -->
  <div data-component="nav">
    <noscript>
      <nav class="site-nav" aria-label="Navegação principal">
        <div class="nav-container">
          <a class="nav-logo" href="index.html">🪐 Meu Planetinha</a>
          <div class="nav-links">
            <a href="explorar/explorar.html">Explorar Jogos</a>
            <a href="sobre_nos/sobre_nos.html">Sobre Nós</a>
          </div>
        </div>
      </nav>
    </noscript>
  </div>

  <!-- Main content -->
  <main id="main-content" class="page-wrapper">

    <!-- Hero Section (unified with carousel — Phase 15) -->
    <section class="hero" id="carousel" role="region"
             aria-label="Carrossel de planetas"
             data-active-planet="calculon" tabindex="0">

      <!-- Title block (above orbit ring) -->
      <div class="hero-header">
        <h1 class="hero-title">Meu Planetinha</h1>
        <p class="hero-subtitle">Cada planeta é uma aventura diferente</p>
      </div>

      <!-- 3D Perspective Scene -->
      <div class="carousel-scene">

        <!-- 3D Orbit Ring -->
        <div class="carousel-orbit" aria-roledescription="carousel" aria-label="Planetas temáticos">

          <!-- Planet: Calculon -->
          <div class="planet-card" data-planet="calculon" data-orbit-zone="center" role="group" aria-roledescription="slide" aria-label="Calculon — Matemática">
            <div class="planet-sphere planet-sphere--calculon"></div>
            <div class="planet-info">
              <span class="planet-name">Calculon</span>
              <span class="planet-subject">Matemática</span>
            </div>
          </div>

          <!-- Planet: Letrion -->
          <div class="planet-card" data-planet="letrion" data-orbit-zone="side" role="group" aria-roledescription="slide" aria-label="Letrion — Português">
            <div class="planet-sphere planet-sphere--letrion"></div>
            <div class="planet-info">
              <span class="planet-name">Letrion</span>
              <span class="planet-subject">Português</span>
            </div>
          </div>

          <!-- Planet: Naturox -->
          <div class="planet-card" data-planet="naturox" data-orbit-zone="back" role="group" aria-roledescription="slide" aria-label="Naturox — Ciências">
            <div class="planet-sphere planet-sphere--naturox"></div>
            <div class="planet-info">
              <span class="planet-name">Naturox</span>
              <span class="planet-subject">Ciências</span>
            </div>
          </div>

          <!-- Planet: Terramund -->
          <div class="planet-card" data-planet="terramund" data-orbit-zone="back" role="group" aria-roledescription="slide" aria-label="Terramund — Geografia">
            <div class="planet-sphere planet-sphere--terramund"></div>
            <div class="planet-info">
              <span class="planet-name">Terramund</span>
              <span class="planet-subject">Geografia</span>
            </div>
          </div>

          <!-- Planet: Globish -->
          <div class="planet-card" data-planet="globish" data-orbit-zone="side" role="group" aria-roledescription="slide" aria-label="Globish — Inglês">
            <div class="planet-sphere planet-sphere--globish"></div>
            <div class="planet-info">
              <span class="planet-name">Globish</span>
              <span class="planet-subject">Inglês</span>
            </div>
          </div>

        </div><!-- /.carousel-orbit -->

        <!-- Navigation arrows (hidden via CSS Phase 15, kept in DOM for JS compat) -->
        <button class="carousel-arrow carousel-arrow--prev" aria-label="Planeta anterior" type="button" tabindex="-1">
          <span class="carousel-arrow-icon" aria-hidden="true">&#8249;</span>
        </button>
        <button class="carousel-arrow carousel-arrow--next" aria-label="Próximo planeta" type="button" tabindex="-1">
          <span class="carousel-arrow-icon" aria-hidden="true">&#8250;</span>
        </button>

        <!-- Sparkle accents (ANIM-03) -->
        <span class="sparkle" style="top:12%;left:8%;animation-delay:-0.0s;animation-duration:2.0s" aria-hidden="true"></span>
        <span class="sparkle" style="top:68%;left:15%;animation-delay:-0.4s;animation-duration:1.6s" aria-hidden="true"></span>
        <span class="sparkle" style="top:25%;left:85%;animation-delay:-1.1s;animation-duration:2.2s" aria-hidden="true"></span>
        <span class="sparkle" style="top:72%;left:90%;animation-delay:-0.7s;animation-duration:1.8s" aria-hidden="true"></span>
        <span class="sparkle" style="top:5%;left:50%;animation-delay:-1.5s;animation-duration:2.4s" aria-hidden="true"></span>
        <span class="sparkle" style="top:55%;left:35%;animation-delay:-0.3s;animation-duration:1.5s" aria-hidden="true"></span>
        <span class="sparkle" style="top:40%;left:70%;animation-delay:-1.9s;animation-duration:2.1s" aria-hidden="true"></span>

      </div><!-- /.carousel-scene -->

      <!-- Hero-level sparkles (outside carousel-scene, behind planets) -->
      <span class="sparkle sparkle--hero" style="top:8%;left:12%;animation-delay:-0.2s;animation-duration:2.3s" aria-hidden="true"></span>
      <span class="sparkle sparkle--hero" style="top:15%;left:78%;animation-delay:-1.3s;animation-duration:1.9s" aria-hidden="true"></span>
      <span class="sparkle sparkle--hero" style="top:82%;left:22%;animation-delay:-0.8s;animation-duration:2.5s" aria-hidden="true"></span>
      <span class="sparkle sparkle--hero" style="top:88%;left:85%;animation-delay:-1.7s;animation-duration:1.7s" aria-hidden="true"></span>

      <!-- CTA prompt (below carousel) -->
      <p class="hero-cta">Escolha seu planeta!</p>

      <!-- Navigation dots -->
      <nav class="carousel-dots" aria-label="Navegação do carrossel">
        <button class="carousel-dot" data-index="0" aria-label="Ir para Calculon" type="button" tabindex="-1"></button>
        <button class="carousel-dot" data-index="1" aria-label="Ir para Letrion" type="button" tabindex="-1"></button>
        <button class="carousel-dot" data-index="2" aria-label="Ir para Naturox" type="button" tabindex="-1"></button>
        <button class="carousel-dot" data-index="3" aria-label="Ir para Terramund" type="button" tabindex="-1"></button>
        <button class="carousel-dot" data-index="4" aria-label="Ir para Globish" type="button" tabindex="-1"></button>
      </nav>

      <!-- Screen reader live region -->
      <div class="carousel-announcer visually-hidden" aria-live="polite" aria-atomic="true"></div>

      <!-- Wave divider: hero → cards transition (TRANS-01) -->
      <svg class="wave-divider wave-divider--hero" viewBox="0 0 1440 48"
           preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"
           aria-hidden="true">
        <path d="M0,28 C240,4 480,44 720,24 C960,4 1200,40 1440,28 L1440,48 L0,48 Z"/>
      </svg>

    </section>

    <!-- Game Cards (Phase 6) -->
    <section id="jogos" aria-label="Jogos disponíveis">
      <div class="container">
        <h2 class="jogos-titulo" tabindex="-1">Jogos Disponíveis</h2>
        <div id="jogos-toolbar" class="jogos-toolbar"></div>
        <div id="game-grid" class="game-grid" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <!-- Footer component (injected by components.js) -->
  <div data-component="footer">
    <noscript>
      <footer class="site-footer">
        <p>© 2025–2026 Meu Planetinha</p>
      </footer>
    </noscript>
  </div>

  <!-- Component loader (nav + footer injection) -->
  <script src="components/components.js"></script>
  <script src="scripts/animacoes.js"></script>

  <!-- Homepage-specific JS (scroll behavior + CTA intercept) -->
  <script src="scripts/homepage.js"></script>
  <script src="scripts/carousel-3d.js"></script>
  <script src="scripts/games.js"></script>

</body>
</html>
